version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cousp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cousp_mis_db
      POSTGRES_USER: cousp_user
      POSTGRES_PASSWORD: cousp_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cousp_user -d cousp_mis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cousp-redis
    restart: unless-stopped
    command: redis-server --requirepass cousp_redis_password_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cousp_redis_password_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: cousp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: cousp_minio_admin
      MINIO_ROOT_PASSWORD: cousp_minio_secret_key_2026
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:

